name: Cadence

options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"

targets:
  Cadence:
    type: application
    platform: iOS
    sources:
      - path: Cadence
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: Cadence/Info.plist
      properties:
        CFBundleDisplayName: Cadence
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # Change this to your own reverse-DNS id before shipping to a device.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cadence
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic

  CadenceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CadenceTests
    dependencies:
      - target: Cadence
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cadence.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Cadence:
    build:
      targets:
        Cadence: all
        CadenceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CadenceTests
    archive:
      config: Release
