name: Cadence Web (build, test, deploy to GitHub Pages)

on:
  push:
    branches: [claude/cadence-web-mvp, main]
    paths: ["web/**", ".github/workflows/web-pages.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web-pages.yml"]
  workflow_dispatch:

# Read-only by default; the deploy job asks for the two extra scopes Pages needs.
permissions:
  contents: read

concurrency:
  group: web-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # GitHub project pages live at /<repo>/, so the base path comes from the repo name.
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Verify build output
        run: node scripts/verify-dist.mjs "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    # Only publish from pushes to the deploy branches (never from pull requests).
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
