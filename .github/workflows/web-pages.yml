name: Cadence Web (build, test, deploy to GitHub Pages)

on:
  push:
    branches: [claude/cadence-web-mvp, claude/cadence-web-redesign, claude/cadence-web-compact-ui, claude/cadence-web-iphone-fixes, claude/cadence-web-persistence, claude/cadence-web-lyrics, claude/cadence-web-features, claude/cadence-web-standalone-fix, claude/cadence-web-standalone-hotfix, claude/cadence-web-polish, main]
    paths: ["web/**", ".github/workflows/web-pages.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web-pages.yml"]
  workflow_dispatch:

# Read-only by default; the deploy job asks for the two extra scopes Pages needs.
permissions:
  contents: read

concurrency:
  group: web-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the upgrade test builds older releases from history

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # GitHub project pages live at /<repo>/, so the base path comes from the repo name.
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Verify build output
        run: node scripts/verify-dist.mjs "/${{ github.event.repository.name }}/"

      # Real-browser checks at iPhone viewport sizes (layout, safe areas, playback, offline, player gestures).
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run e2e
        env:
          E2E_BASE: /${{ github.event.repository.name }}/

      # Service worker installs and updates on a host that 404s its config files (Cloudflare Pages), base "/".
      - name: Updates on a Cloudflare-like host
        run: npx vite build --outDir dist-root && HOST_DIST=dist-root npm run e2e:host
        env:
          VITE_BASE: /

      # Toasts, long-press menus, scrubbing, queue drag/swipe/undo, keep playing similar, karaoke, recap image, discs.
      - name: Polish interactions
        run: npm run e2e:polish
        env:
          E2E_BASE: /${{ github.event.repository.name }}/

      # Home Screen app with a viewport shorter than the screen: tab bar stays fully inside the window (emulated numbers).
      - name: Short Home Screen window keeps the tab bar visible
        run: npm run e2e:fill
        env:
          E2E_BASE: /${{ github.event.repository.name }}/

      # Your library must survive updates: import on an older release, load this build on the same origin, then a further deploy.
      - name: Upgrade keeps your music
        run: npm run e2e:upgrade

      # Same artwork pixel checks in real WebKit (the engine behind Safari and iOS web apps).
      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Artwork rendering in WebKit
        run: npm run e2e:webkit-art
        env:
          E2E_BASE: /${{ github.event.repository.name }}/

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: web/e2e/screenshots
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    # Publish from the original-version branch and main on push. The redesign branch is built and
    # tested on every push but only published when you run the workflow manually on it, so the
    # original site is never replaced by accident (there is one Pages site per repo).
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/claude/cadence-web-mvp' || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
