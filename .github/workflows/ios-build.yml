name: iOS build & test

# Compiles the app and runs the unit tests on a GitHub-hosted macOS runner, so no Mac is needed.
# Also produces an UNSIGNED .ipa artifact (see docs/CLOUD_BUILD.md for what you can do with it).

on:
  push:
    branches: ["**"]
    paths-ignore: ["web/**", ".github/workflows/web-pages.yml", "docs/WEB_*.md"]
  pull_request:
    paths-ignore: ["web/**", ".github/workflows/web-pages.yml", "docs/WEB_*.md"]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          mkdir -p build
          xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Cadence.xcodeproj -scheme Cadence

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices, reverse=True):
              if 'iOS' not in runtime:
                  continue
              for d in devices[runtime]:
                  if d['name'].startswith('iPhone') and d.get('isAvailable', True):
                      print(d['udid']); sys.exit(0)
          sys.exit('no iPhone simulator found')
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Build and test (simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Cadence.xcodeproj \
            -scheme Cadence \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee build/xcodebuild-test.log | tail -n 80
        env:
          NSUnbufferedIO: "YES"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            build/xcodebuild-test.log
            build/TestResults.xcresult
          if-no-files-found: ignore

      - name: Build unsigned device .app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cadence.xcodeproj \
            -scheme Cadence \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 40

      - name: Package unsigned .ipa
        run: |
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../Cadence-unsigned.ipa Payload)
          ls -lh build/Cadence-unsigned.ipa

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Cadence-unsigned-ipa
          path: build/Cadence-unsigned.ipa
